services:
  postgres:
    image: postgres:16-alpine
    container_name: sentineltech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentineltech
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - sentineltech-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sentineltech"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sentineltech-postgres-data: